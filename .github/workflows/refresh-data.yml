name: Refresh data

# CollegeFootballData cold responses can take ~30s, which does not fit inside a
# Vercel edge function, so data pulls run here and write straight to Neon.

on:
  schedule:
    # Rosters, teams and schedules once a day (07:15 UTC).
    - cron: '15 7 * * *'
    # Gameday polling is scoped to the hours a game can actually be in
    # progress. Running every 10 minutes around the clock spent a billed minute
    # per run (jobs round up) while ~90% of them exited immediately with no
    # active game window. The windows below come from the season's kickoff
    # distribution in UTC and cover every game with at least two polls.
    #
    # Main slate: Saturday afternoon through Sunday morning.
    - cron: '*/10 16-23 * 1,8-12 6'
    - cron: '*/10 0-7 * 1,8-12 0'
    # Midweek and Friday night games: weekday evenings, and the following
    # early hours in UTC.
    - cron: '*/10 17-23 * 1,8-12 2-5'
    - cron: '*/10 0-5 * 1,8-12 3-6'
    # Sunday evening and the Labor Day Monday carry a handful of games that no
    # other window reaches.
    - cron: '*/10 20-23 * 1,8-12 0'
    - cron: '*/10 0-2,23 * 1,8-12 1'
    # Safety discovery still runs off-window to pick up moved games and box
    # scores the source published late.
    - cron: '7 */6 * 1,8-12 *'
  workflow_dispatch:
    inputs:
      job:
        description: Which refresh to run
        type: choice
        options: [all, projections, players, schedules, live, gameday]
        default: all
      force:
        description: Re-fetch projection stats even if already cached
        type: boolean
        default: false
      week:
        description: Optional app week for manual live backfill (0-18)
        type: string
        required: false

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Require a trusted quality gate for this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml \
            --commit "$GITHUB_SHA" --branch main --limit 20 \
            --json event,conclusion \
            --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].conclusion' |
            grep -qx success

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # The daily cron and manual runs rebuild the full dataset; the frequent
      # crons refresh live scoring plus schedules, which is where a game's
      # completion status lands.
      - name: Decide scope
        id: scope
        env:
          REQUESTED_JOB: ${{ github.event.inputs.job }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          job="$REQUESTED_JOB"
          if [ -z "$job" ]; then
            if [ "$SCHEDULE_EXPR" = "15 7 * * *" ]; then job=all; else job=gameday; fi
          fi
          case "$job" in all|projections|players|schedules|live|gameday) ;; *) exit 1 ;; esac
          echo "job=$job" >> "$GITHUB_OUTPUT"

      - name: Refresh projection stats
        if: steps.scope.outputs.job == 'all' || steps.scope.outputs.job == 'projections'
        run: npm run refresh:projections
        env:
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}

      - name: Refresh players
        if: ${{ !cancelled() && (steps.scope.outputs.job == 'all' || steps.scope.outputs.job == 'players') }}
        run: npm run refresh:players

      - name: Refresh schedules
        if: ${{ !cancelled() && (steps.scope.outputs.job == 'all' || steps.scope.outputs.job == 'schedules') }}
        run: npm run refresh:schedules

      - name: Refresh live scoring
        if: ${{ !cancelled() && (steps.scope.outputs.job == 'all' || steps.scope.outputs.job == 'live') }}
        run: |
          if [ -n "$REQUESTED_WEEK" ]; then export WEEK="$REQUESTED_WEEK"; fi
          npm run refresh:live
        env:
          REQUESTED_WEEK: ${{ github.event.inputs.week }}

      - name: Refresh active games and run safety discovery
        if: ${{ !cancelled() && steps.scope.outputs.job == 'gameday' }}
        run: npm run refresh:gameday
        env:
          DISCOVERY_SWEEP: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '7 */6 * 1,8-12 *') && '1' || '' }}
