services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: fixture
      POSTGRES_PASSWORD: local-fixture-only
      POSTGRES_DB: gridiron_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixture -d gridiron_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  proxy:
    image: ghcr.io/neondatabase/wsproxy@sha256:7f2e2149aa6a57ba382a140102fba44f5053f3e44389ccc18adcecf896054efb
    ports:
      - "127.0.0.1:${INTEGRATION_PROXY_PORT:-55433}:80"
    environment:
      ALLOW_ADDR_REGEX: "^db:5432$"
      LOG_CONN_INFO: "false"
    depends_on:
      db:
        condition: service_healthy
